<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11142b"><title>ScrollWise — Curiosity Feed</title><style>:root{font-family:system-ui,sans-serif;color:#f7f4ff;background:#101329}*{box-sizing:border-box}body{margin:0}main{max-width:520px;margin:auto;padding:18px}.brand{display:flex;justify-content:space-between;align-items:center;color:#c8aaff}.pill{border:1px solid #65618a;border-radius:30px;padding:5px 11px;font-size:12px}h1{font-size:27px;margin:16px 0 4px}p{color:#c4c2d6}.search{display:flex;gap:8px;margin:20px 0}input{min-width:0;flex:1;border:1px solid #59577a;border-radius:13px;padding:14px;background:#20243e;color:white;font-size:16px}button{border:0;border-radius:13px;background:#a884ff;color:#17102e;padding:12px 16px;font-weight:700;cursor:pointer}.screen{min-height:440px;background:radial-gradient(circle at 50% 25%,#55439a,#252448 52%,#171b35);border:1px solid #6a5c98;border-radius:25px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 15px 50px #08091b}.top{display:flex;justify-content:space-between;color:#cbbcf6;font-size:12px}.symbol{text-align:center;font-size:80px;margin:30px 0 12px}.screen h2{font-size:29px;line-height:1.13;margin:0}.screen p{color:#f2eaff;font-size:17px;line-height:1.5}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.actions button{flex:1}.secondary{background:#2d3155;color:white}.small{font-size:12px;text-align:center;margin:18px 0;color:#aaa9c8}</style></head><body><main><div class="brand"><strong>✦ ScrollWise</strong><span class="pill">Prototype 0.2</span></div><h1>Feed your curiosity.</h1><p>One fascinating idea at a time. Swipe through bite-size lessons, not brain rot.</p><div class="search"><input id="topic" placeholder="Try: psychology, space, consciousness" aria-label="Learning topic"><button id="go">Explore</button></div><section class="screen" id="screen" aria-live="polite"><div class="top"><span id="category">CURIOUS MINDS</span><span id="counter">1 / 5</span></div><div><div class="symbol" id="symbol">🧠</div><h2 id="heading"></h2><p id="lesson"></p></div><div class="top"><span>SCROLLWISE ORIGINAL</span><span>✦ LEARN SOMETHING</span></div></section><div class="actions"><button id="deeper">🔎 Go deeper</button><button class="secondary" id="surprise">🎲 Surprise me</button></div><div id="detail" style="display:none;margin-top:14px;background:#222641;border:1px solid #65618a;border-radius:18px;padding:18px;line-height:1.5"></div><div class="actions"><button class="secondary" id="prev">← Previous</button><button id="next">Next lesson →</button></div><p class="small">Free offline demo · Curated lessons · No account needed · AI generation comes later</p></main><script>const lessons=[{category:'PSYCHOLOGY',symbol:'🧠',heading:'Your memory is not a video recording.',lesson:'Every time you recall an event, your brain reconstructs it. Details can change through suggestion and later experiences. Your confidence in a memory is not a guarantee of its accuracy.'},{category:'NEUROSCIENCE',symbol:'🪞',heading:'Your brain predicts what you see.',lesson:'Perception combines sensory signals with expectations. That helps you recognize the world quickly, but it also makes optical illusions possible. You do not passively receive reality like a camera.'},{category:'BIOLOGY',symbol:'🐙',heading:'An octopus has a surprisingly distributed nervous system.',lesson:'Much of an octopus’s nervous system is in its arms. Its arms can perform complex local sensing and movement, while still coordinating with the central brain.'},{category:'PHYSICS',symbol:'⏳',heading:'Time passes differently at different heights.',lesson:'General relativity predicts clocks tick at slightly different rates depending on gravity. Precise clocks can measure this even over small height differences. GPS systems account for relativity.'},{category:'PHILOSOPHY',symbol:'🚢',heading:'When does a thing stop being itself?',lesson:'The Ship of Theseus asks whether an object remains the same after every part is replaced. The puzzle opens questions about identity, continuity, and what makes you you.'}];const extra=[{why:'Memory is reconstructive: recalling a memory can make it susceptible to updates before it is stored again. This does not mean every memory changes each time.',next:'Why eyewitness confidence can mislead'},{why:'The brain combines incoming sensory data with learned expectations. When expectations and sensory evidence conflict, illusions can reveal the process.',next:'How optical illusions fool perception'},{why:'Octopus arms contain extensive neural circuits that process sensory information and coordinate local movement. They are not eight independent brains.',next:'How distributed intelligence works'},{why:'Gravity affects the rate at which clocks run. Higher clocks generally run slightly faster than lower ones, although motion also affects time.',next:'How GPS uses relativity'},{why:'The Ship of Theseus is a thought experiment, not a scientific test. It challenges whether identity depends on materials, history, structure, or continuity.',next:'What makes personal identity persist'}];let i=0;function render(){document.getElementById('detail').style.display='none';{let x=lessons[i];for(const [id,val] of Object.entries({category:x.category,symbol:x.symbol,heading:x.heading,lesson:x.lesson,counter:`${i+1} / ${lessons.length}`}))document.getElementById(id).textContent=val}document.getElementById('deeper').onclick=()=>{let d=document.getElementById('detail');d.style.display=d.style.display==='none'?'block':'none';d.textContent='🧩 THE DEEPER STORY\n\n'+extra[i].why+'\n\n🐇 NEXT RABBIT HOLE: '+extra[i].next;d.style.whiteSpace='pre-line'};document.getElementById('surprise').onclick=()=>{let n=i;while(n===i)n=Math.floor(Math.random()*lessons.length);i=n;render()};document.getElementById('next').onclick=()=>{i=(i+1)%lessons.length;render()};document.getElementById('prev').onclick=()=>{i=(i-1+lessons.length)%lessons.length;render()};document.getElementById('go').onclick=()=>{let q=document.getElementById('topic').value.trim().toLowerCase();if(!q)return;let hits=lessons.map((x,n)=>({n,score:(x.category+' '+x.heading+' '+x.lesson).toLowerCase().split(/\W+/).filter(w=>q.includes(w)&&w.length>3).length})).sort((a,b)=>b.score-a.score);if(hits[0].score){i=hits[0].n;render()}else alert('This first demo has five curated lessons. Custom AI topics are coming in a later version. Try psychology, biology, physics, or philosophy!')};let startY=0;document.getElementById('screen').addEventListener('touchstart',e=>startY=e.touches[0].clientY,{passive:true});document.getElementById('screen').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientY-startY;if(Math.abs(d)>65){i=(i+(d<0?1:lessons.length-1))%lessons.length;render()}},{passive:true});render();</script></body></html>
